name: Feature request
description: Propose an enhancement to spring-ai-agents-md
title: "[Feature] "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: Please search existing issues and feature requests before submitting a new one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see. Include an example when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other information that would help evaluate the request.
