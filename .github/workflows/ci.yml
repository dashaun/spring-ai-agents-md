name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (boot ${{ matrix.boot }}, spring-ai ${{ matrix.spring-ai }})
    strategy:
      fail-fast: false
      matrix:
        boot: [4.1.0, 4.1.1]
        spring-ai: [2.0.0, 2.0.1]
    uses: spring-ai-community/community-workflows/.github/workflows/ci-build.yml@main
    with:
      java-version: '17'
      maven-goals: >
        clean verify -Pwiremock-integration
        -Dspring-boot.version=${{ matrix.boot }}
        -Dspring-ai.version=${{ matrix.spring-ai }}
