name: Ollama Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ollama-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-integration:
    name: Ollama integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Ollama integration test
        run: ./mvnw --batch-mode --no-transfer-progress -pl examples/spring-ai-agents-md-example -am verify -Pollama-integration
