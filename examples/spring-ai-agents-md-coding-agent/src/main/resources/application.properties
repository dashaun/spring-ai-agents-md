logging.level.io.netty.resolver.dns.DnsServerAddressStreamProviders=OFF

spring.application.name=spring-ai-agents-md-coding-agent
spring.main.web-application-type=none
spring.ai.ollama.chat.model=laguna-xs-2.1:q4_k_m
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.num-ctx=16384
steward.workspace=${user.dir}
steward.max-file-size=128KB
steward.max-read-lines=200
steward.max-list-entries=200
steward.max-search-matches=50
steward.max-search-depth=12
